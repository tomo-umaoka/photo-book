<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="A photographic slideshow gallery.">
  <title>My Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="gallery">
    <header class="site-header">
      <a class="brand" href="./" aria-label="My Gallery home">
        MY GALLERY
      </a>
      <span class="header-label">PHOTOGRAPHY</span>
    </header>

    <section class="viewer" aria-label="Photo slideshow">
      <div
        class="slides"
        id="slides"
        aria-live="off"
        aria-atomic="true"
      >
        <!-- JavaScript inserts the slides here. -->
      </div>

      <button
        class="nav-button previous"
        id="previous"
        type="button"
        aria-label="Previous photo"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <button
        class="nav-button next"
        id="next"
        type="button"
        aria-label="Next photo"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>

      <div class="empty-state" id="empty-state" hidden>
        <h2>Your gallery starts here</h2>
        <p>Add your photos to the <code>images</code> folder
          and update the list in <code>script.js</code>.</p>
      </div>
    </section>

    <section class="controls" aria-label="Slideshow controls">
      <div class="caption-row">
        <h1 id="photo-title">Loading gallery…</h1>
        <span class="counter" id="counter">— / —</span>
      </div>

      <div
        class="progress-track"
        id="progress-track"
        role="group"
        aria-label="Choose a photo"
      >
        <!-- Progress buttons are generated by JavaScript. -->
      </div>

      <p class="hint">Use the arrows or swipe to explore</p>
    </section>

    <footer class="site-footer">
      <span>MADE TO BE VIEWED</span>
      <span>© <span id="year"></span> MY GALLERY</span>
    </footer>
  </main>
</body>
</html>
